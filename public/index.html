<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taverna & Oráculo - D&D 5e</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topo">
        <h1>Taverna & Oráculo</h1>
        <p>Invoque um desafio do bestiário e receba a profecia para sobreviver.</p>
    </header>

    <main class="container">
        <section class="controles">
            <select id="select-monstro" aria-label="Escolha um monstro">
                <option value="goblin">Carregando monstros...</option>
            </select>
            <button id="btn-invocar">Invocar Desafio</button>
            <button id="btn-aleatorio" type="button">Desafio Aleatório</button>
        </section>

        
        <section id="resultado-aventura" class="grid-aventura"></section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
